<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Incident Assistant</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    #app {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,.12);
      width: 680px;
      height: 88vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 16px 20px;
      border-bottom: 1px solid #e5e7eb;
    }
    header h1 { font-size: 1rem; font-weight: 600; color: #111; }
    header p  { font-size: .8rem; color: #6b7280; margin-top: 3px; }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: .875rem;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: #2563eb;
      color: #fff;
      border-bottom-right-radius: 3px;
    }
    .msg.assistant {
      align-self: flex-start;
      background: #f3f4f6;
      color: #111;
      border-bottom-left-radius: 3px;
    }
    .msg.thinking {
      color: #9ca3af;
      font-style: italic;
      background: #f9fafb;
    }

    #form {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      border-top: 1px solid #e5e7eb;
      align-items: flex-end;
    }

    #input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: .875rem;
      font-family: inherit;
      resize: none;
      max-height: 120px;
      outline: none;
      overflow-y: auto;
    }
    #input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.1); }

    #send {
      padding: 10px 18px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: .875rem;
      font-family: inherit;
      white-space: nowrap;
      transition: background .15s;
    }
    #send:hover:not(:disabled) { background: #1d4ed8; }
    #send:disabled { opacity: .5; cursor: not-allowed; }
  </style>
</head>
<body>
<div id="app">
  <header>
    <h1>Incident Assistant</h1>
    <p>Ask me to create, list, update, or review incidents</p>
  </header>
  <div id="messages" role="log" aria-live="polite"></div>
  <div id="form">
    <textarea id="input" placeholder="Type a message… (Enter to send, Shift+Enter for newline)" rows="1"></textarea>
    <button id="send">Send</button>
  </div>
</div>

<script>
  const messagesEl = document.getElementById('messages');
  const inputEl    = document.getElementById('input');
  const sendBtn    = document.getElementById('send');

  let conversationId = sessionStorage.getItem('conversationId') || null;

  function appendMessage(text, role) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  // Auto-grow textarea up to max-height
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  });

  async function sendMessage() {
    const message = inputEl.value.trim();
    if (!message) return;

    inputEl.value = '';
    inputEl.style.height = 'auto';
    sendBtn.disabled = true;

    appendMessage(message, 'user');
    const thinking = appendMessage('Thinking…', 'assistant thinking');

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message, conversationId })
      });

      const data = await res.json();
      thinking.remove();

      if (!res.ok) {
        appendMessage('Error: ' + (data.message || res.statusText), 'assistant');
        return;
      }

      conversationId = data.conversationId;
      sessionStorage.setItem('conversationId', conversationId);
      appendMessage(data.reply, 'assistant');

    } catch (err) {
      thinking.remove();
      appendMessage('Network error: ' + err.message, 'assistant');
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener('click', sendMessage);

  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  inputEl.focus();
</script>
</body>
</html>
